version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: rna_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: rna_db
      MYSQL_USER: rna_user
      MYSQL_PASSWORD: rna_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: rna_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: rna_api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: rna_user
      DATABASE_PASSWORD: rna_password
      DATABASE_NAME: rna_db
      REDIS_URL: redis://rna_redis:6379

  worker:
    build: .
    container_name: rna_worker
    restart: always
    command: rq worker --with-scheduler -u redis://rna_redis:6379
    depends_on:
      - redis
      - db
    volumes:
      - .:/app

volumes:
  db_data:
